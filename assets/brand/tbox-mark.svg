<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="T-Box 品牌标记">
  <title>T-Box mark</title>
  <!--
    T-Box 主标记 · 定稿版

    构成（4 个圆角矩形，无曲线、无渐变、无描边）：
      外框  = 屏幕 / 盒子（Box），圆角 104 对应桌面软件的界面感
      白 T  = 品牌首字母，横 272×104、竖 104×200
      薄荷条 = 实时浮现的提词条，产品唯一的核心动作

    比例是用像素量化迭代出来的，不是凭感觉：
      原始版本（竖笔 64 / 框 432）在 16px 下 T 只剩 18 个像素、占比 10%；
      加粗到竖笔 104 / 框 464 后，16px 下 T 有 24 个像素、薄荷条 22 个像素，
      两个元素都还在，24px 以上 T 占比稳定在 14%–17%。
      留白按光学居中调：上 80 / 下 72。

    用法：
      深底 —— 原样使用（绿框 + 米白 T + 薄荷条）
      单色 —— 三个 fill 统一换成目标色；因为没有渐变和细线，不会丢结构
      浅底 —— 原样使用，绿框在浅底上是实色块，对比度足够
  -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#0C8F68"/>
  <rect x="120" y="104" width="272" height="104" rx="52" fill="#F3F1E9"/>
  <rect x="204" y="104" width="104" height="200" rx="52" fill="#F3F1E9"/>
  <rect x="148" y="352" width="216" height="64" rx="32" fill="#71D9B4"/>
</svg>
