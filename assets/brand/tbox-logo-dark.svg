<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">T-Box 横向标志 · 深底版</title>
  <desc id="d">左侧主标记 + 右侧转曲字标。字母为纯路径，不依赖任何字体文件。</desc>
  <!--
    合并说明（这一版是两个方案的互补结果）：
      · 左侧标记用自研定稿版：绿框 + 米白 T + 薄荷条。它背景无关，
        且在 16px 下识别元素有 46 个像素，是「绿框+深内屏」方案的 2.1 倍。
      · 右侧字标用 Codex 产出的转曲字母路径（T / - / B / o / x），
        好处是不依赖系统字体，安装器、任务栏、电商主图渲染结果完全一致。
      · 配色为深底优化：字母用米白而非品牌绿，否则深底上对比度不足。
  -->
  <g transform="translate(56 48) scale(0.45)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#0C8F68"/>
    <rect x="120" y="104" width="272" height="104" rx="52" fill="#F3F1E9"/>
    <rect x="204" y="104" width="104" height="200" rx="52" fill="#F3F1E9"/>
