name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          find . -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

  static-audit:
    name: Static site audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run DOM smoke checks
        run: python3 check-site-dom.py .
      - name: Run social metadata checks
        run: node check-social.mjs

  live-site:
    name: Live site checks
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check deployed pages and canonical metadata
        shell: pwsh
        run: ./check-site.ps1 -BaseUrl 'https://tboxapp.top'

